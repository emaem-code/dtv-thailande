<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DTV Destination Thaïlande">
  <title>DTV Destination Thaïlande</title>
  <defs>
    <linearGradient id="sphere" x1="0.08" y1="0.05" x2="0.92" y2="0.95">
      <stop offset="0" stop-color="#f5c04a"/>
      <stop offset="0.42" stop-color="#f0a621"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <clipPath id="inDisc">
      <circle cx="256" cy="256" r="224"/>
    </clipPath>
  </defs>

  <!-- 1. L'orbite : seules les pointes hors du disque resteront visibles -->
  <path d="M 30 348 Q 260 210 498 178 Q 480 214 466 226 Q 250 268 44 376 Z" fill="#e8a83c"/>

  <!-- 2. Le disque, qui recouvre la partie centrale de l'orbite -->
  <circle cx="256" cy="256" r="224" fill="url(#sphere)"/>

  <!-- 3. L'orbite repassant devant le disque : la superposition crée le 3e ton -->
  <g clip-path="url(#inDisc)">
    <path d="M 30 348 Q 260 210 498 178 Q 480 214 466 226 Q 250 268 44 376 Z"
          fill="#7a4208" fill-opacity="0.22"/>
  </g>
</svg>
